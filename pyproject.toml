[project]
name = "sound-remover"
version = "0.1.0"
description = "吹奏楽・発表会動画からのロスレス音声抽出・AIピンポイント声除去・ノイズ除去・マスタリングアプリ"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4.0,<2.6.0",
    "torchaudio>=2.4.0,<2.6.0",
    "demucs>=4.0.1",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "noisereduce>=3.0.2",
    "pyloudnorm>=0.1.1",
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "static-ffmpeg>=2.7",
    "imageio-ffmpeg>=0.5.1",
    "pytest>=8.0.0",
]

[project.scripts]
sound-remover = "sound_remover.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sound_remover"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
